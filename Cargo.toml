[package]
name = "embassy-nrf-i2c-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "=0.11.0", features = ["nrf52840", "time-driver-rtc1", "time", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embedded-hal-async = "1.0"
nrf-sdc = { version = "=0.4.0", features = ["nrf52840", "peripheral", "defmt"] }
nrf-mpsl = { version = "=0.4.0", features = ["nrf52840", "critical-section-impl", "defmt"] }
trouble-host = { version = "=0.8.0", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
static_cell = "2.1"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-rtt"] }

[profile.release]
debug = 2
lto = true
opt-level = "z"
